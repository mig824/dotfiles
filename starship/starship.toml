# Clean minimal — directory + branch on top, arrow below
# Only modules listed in `format` render, so no need to disable the rest.

command_timeout = 3000

format = """
$hostname\
$directory\
$git_branch\
$git_state\
$cmd_duration\
$jobs\
$status
$character"""

[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "bold #ff5f00"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[$branch]($style) "

# Cheap: reads .git/ state files, no working-tree scan.
[git_state]
format = '([$state( $progress_current/$progress_total)]($style)) '
style = "bold yellow"

# Only shows for commands slower than min_time.
[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "bold yellow"

[jobs]
format = "[$symbol$number]($style) "
symbol = "⚙ "
style = "bold blue"

[status]
disabled = false
format = "[$status]($style) "
style = "bold red"
